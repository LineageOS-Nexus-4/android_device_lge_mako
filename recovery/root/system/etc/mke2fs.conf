[defaults]
    base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    enable_periodic_fsck = 0

[fs_types]
    ext4 = {
        features = has_journal,extent,flex_bg,uninit_bg,dir_nlink,extra_isize
        inode_size = 256
    }
