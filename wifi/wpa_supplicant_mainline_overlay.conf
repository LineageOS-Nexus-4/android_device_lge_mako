# mako bring-up: prima (qcwcn) has no dedicated P2P device interface
# (p2p-dev-wlan0), so wpas_p2p_init() runs on wlan0 and the mainline
# supplicant's AidlManager classifies wlan0 as a P2P iface
# (global->p2p_init_wpa_s == wpa_s). ISupplicant.addStaInterface then
# fails with FAILURE_UNKNOWN (code 1) because the STA iface object was
# never created - wifi can never be enabled. Disabling P2P keeps
# p2p_init_wpa_s NULL and wlan0 registers as a STA iface.
p2p_disabled=1
